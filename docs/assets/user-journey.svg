<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">From everyday record to informed growth</title>
  <desc id="d">Animated pipeline: capture, extract, review, reconcile, seal, understand and act. A pulse travels along the line and lights each stage.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="#0f172a"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e0e7ff">From everyday record to informed growth</text>

  <!-- track -->
  <rect x="100" y="126" width="1000" height="8" rx="4" fill="url(#line)" opacity="0.35"/>

  <!-- stages -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <g transform="translate(100,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#6366f1" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">01</text>
      <text y="22" font-size="14" font-weight="600" fill="#c7d2fe">Capture</text>
    </g>
    <text x="100" y="196" font-size="13" fill="#94a3b8">Photo · CSV · XLSX</text>
    <text x="100" y="214" font-size="13" fill="#94a3b8">PDF · manual entry</text>

    <!-- 2 -->
    <g transform="translate(267,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#6366f1" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">02</text>
      <text y="22" font-size="14" font-weight="600" fill="#c7d2fe">Extract</text>
    </g>
    <text x="267" y="196" font-size="13" fill="#94a3b8">Structure fields</text>
    <text x="267" y="214" font-size="13" fill="#94a3b8">from messy sources</text>

    <!-- 3 -->
    <g transform="translate(434,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#6366f1" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" begin="2.6s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">03</text>
      <text y="22" font-size="14" font-weight="600" fill="#c7d2fe">Review</text>
    </g>
    <text x="434" y="196" font-size="13" fill="#94a3b8">Owner confirms</text>
    <text x="434" y="214" font-size="13" fill="#94a3b8">before anything saves</text>

    <!-- 4 -->
    <g transform="translate(601,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#6366f1" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" begin="3.9s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">04</text>
      <text y="22" font-size="14" font-weight="600" fill="#c7d2fe">Reconcile</text>
    </g>
    <text x="601" y="196" font-size="13" fill="#94a3b8">Stock, sales, cash</text>
    <text x="601" y="214" font-size="13" fill="#94a3b8">per product</text>

    <!-- 5 -->
    <g transform="translate(768,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#6366f1" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" begin="5.2s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">05</text>
      <text y="22" font-size="14" font-weight="600" fill="#c7d2fe">Seal</text>
    </g>
    <text x="768" y="196" font-size="13" fill="#94a3b8">SHA-256 chain</text>
    <text x="768" y="214" font-size="13" fill="#94a3b8">+ Ed25519 signature</text>

    <!-- 6 -->
    <g transform="translate(935,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#6366f1" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" begin="6.5s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">06</text>
      <text y="22" font-size="14" font-weight="600" fill="#c7d2fe">Understand</text>
    </g>
    <text x="935" y="196" font-size="13" fill="#94a3b8">Revenue range, score,</text>
    <text x="935" y="214" font-size="13" fill="#94a3b8">Themba explanations</text>

    <!-- 7 -->
    <g transform="translate(1102,130)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#1e1b4b" stroke="#34d399" stroke-width="2"/>
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#34d399" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15;0.15" keyTimes="0;0.06;0.2;1" dur="9s" begin="7.8s" repeatCount="indefinite"/>
      </rect>
      <text y="-6" font-size="26" font-weight="800" fill="#ffffff">07</text>
      <text y="22" font-size="14" font-weight="600" fill="#a7f3d0">Grow</text>
    </g>
    <text x="1102" y="196" font-size="13" fill="#94a3b8">Plans, tasks, funding</text>
    <text x="1102" y="214" font-size="13" fill="#94a3b8">and verifiable reports</text>
  </g>

  <!-- travelling pulse -->
  <circle r="14" fill="url(#pulse)" opacity="0.9">
    <animateMotion path="M100,130 L1102,130" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#ffffff">
    <animateMotion path="M100,130 L1102,130" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">AI reads · code decides · the trader confirms · the ledger remembers</text>
</svg>
