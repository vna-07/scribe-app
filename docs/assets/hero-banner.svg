<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">SCRIBE Intelligence</title>
  <desc id="d">Animated banner: a receipt being scanned, the SCRIBE name, its acronym and rotating one-line descriptions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="1020" cy="70" r="120" fill="#6366f1" opacity="0.18">
      <animate attributeName="cy" values="70;110;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="300" r="90" fill="#34d399" opacity="0.12">
      <animate attributeName="cy" values="300;260;300" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="320" r="100" fill="#818cf8" opacity="0.14">
      <animate attributeName="cx" values="60;120;60" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- receipt being scanned -->
    <g transform="translate(70,48)">
      <rect x="0" y="0" width="170" height="244" rx="10" fill="#f8fafc"/>
      <path d="M0 244 l14 -10 l14 10 l14 -10 l14 10 l14 -10 l14 10 l14 -10 l14 10 l14 -10 l14 10 l14 -10 l14 10 V250 H0 Z" fill="#f8fafc"/>
      <rect x="18" y="20" width="90" height="10" rx="4" fill="#312e81"/>
      <rect x="18" y="44" width="134" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="18" y="62" width="110" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="18" y="80" width="126" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="18" y="98" width="98" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="18" y="116" width="120" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="18" y="134" width="84" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="18" y="164" width="134" height="2" fill="#94a3b8"/>
      <rect x="18" y="178" width="64" height="12" rx="4" fill="#34d399"/>
      <rect x="96" y="178" width="56" height="12" rx="4" fill="#a5b4fc"/>
      <!-- corner brackets -->
      <g fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round">
        <path d="M-10 18 V-10 H18"/>
        <path d="M180 18 V-10 H152"/>
        <path d="M-10 226 V254 H18"/>
        <path d="M180 226 V254 H152"/>
      </g>
      <!-- scan beam -->
      <rect x="-10" y="0" width="190" height="6" fill="url(#beam)">
        <animate attributeName="y" values="0;240;0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- title block -->
    <text x="300" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="#ffffff">SCRIBE
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <rect x="304" y="168" width="0" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="0;380" dur="1.4s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="304" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c7d2fe" opacity="0">Real Records. Greater Opportunities.
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1s" fill="freeze"/>
    </text>

    <!-- acronym -->
    <text x="304" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#a5b4fc" opacity="0">
      <tspan font-weight="800" fill="#34d399">S</tspan>mall-business <tspan font-weight="800" fill="#34d399">C</tspan>larity · <tspan font-weight="800" fill="#34d399">R</tspan>ecords · <tspan font-weight="800" fill="#34d399">I</tspan>ntelligence · <tspan font-weight="800" fill="#34d399">B</tspan>usiness <tspan font-weight="800" fill="#34d399">E</tspan>nablement
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.6s" fill="freeze"/>
    </text>

    <!-- rotating descriptions -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e0e7ff">
      <text x="304" y="290" opacity="0">Capture the records you already keep.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" begin="2.4s" repeatCount="indefinite"/>
      </text>
      <text x="304" y="290" opacity="0">Seal them in a tamper-evident ledger.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" begin="6.4s" repeatCount="indefinite"/>
      </text>
      <text x="304" y="290" opacity="0">Understand, plan and prepare to grow.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" begin="10.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- hackathon chip -->
    <g transform="translate(790,36)">
      <rect width="360" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.5"/>
      <circle cx="22" cy="19" r="6" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e0e7ff">FNB App of the Year Hackathon 2026</text>
    </g>
  </g>
</svg>
